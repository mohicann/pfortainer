# fbnas /usr/local/etc/appjail/appjail.conf
# 전체 항목은 appjail.conf(5). ENABLE_ZFS는 첫 사용 뒤에 바꾸지 말 것
# (appjail-tutorial(7) "Don't mix ZFS and non-ZFS file systems!").

EXT_IF=igc3
ON_IF=igc3
FREEBSD_VERSION=15.1-RELEASE
FREEBSD_ARCH=amd64
IMAGE_ARCH=amd64
SHORTEN_DOMAIN_NAMES=1

# jail·release를 118G 부팅 SSD(zroot)가 아니라 데이터 풀에 둔다 → zdata/appjail
ENABLE_ZFS=1
ZPOOL=zdata
ZROOTFS=appjail

# jail resolv.conf를 호스트 /etc/resolv.conf에서 복사하지 않는다.
# 호스트는 Tailscale MagicDNS(100.100.100.100)를 쓰게 되는데 jail에서는 그 주소가
# 안 닿아 DNS만 실패했던 bastille 함정 방지 (reference_bastille_new_jail_checklist).
DEFAULT_RESOLV_CONF=/usr/local/etc/appjail/resolv.conf
DEFAULT_TIMEZONE=Asia/Seoul

TAR_XZ_ARGS="--xz --options xz:threads=0"
TAR_ZSTD_ARGS="--zstd --options zstd:threads=0"

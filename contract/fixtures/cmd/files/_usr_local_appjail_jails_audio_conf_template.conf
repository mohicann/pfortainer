exec.start: "/bin/sh /etc/rc"
exec.stop: "/bin/sh /etc/rc.shutdown jail"
mount.devfs
persist
vnet
vnet.interface: "eb_ca897ad527e"
exec.prestart: "appjail network plug -e \"ca897ad527e\" -n \"ajnet\""
exec.poststart: "appjail network assign -d -e \"ca897ad527e\" -j \"${name}\" -n \"ajnet\""
exec.poststop: "appjail network unplug \"ajnet\" \"ca897ad527e\""
exec.prestart+: "appjail nat on jail \"${name}\""
exec.poststop+: "appjail nat off jail \"${name}\""
exec.prestart+: "appjail expose on \"${name}\""
exec.poststop+: "appjail expose off \"${name}\""
